<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8">
<script>try{var t=localStorage.getItem("qs_theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<title>Sequence High Prob Harian WansVerse</title>
<style>
:root{--bg:#f4f5f8;--fg:#14161c;--mut:#6b7080;--card:#fff;--ln:#d9dce5;--acc:#e11d48;--q1:#a9aebb;--q2:#e07a78;--q3:#6bbd86;--q4:#6aa3d9;--hl:#b8860b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#07060f;--fg:#eef0ff;--mut:#8f8bb8;--card:#0e0b1c;--ln:#2b2350;--acc:#ff2e9a;--q1:#c9ceff;--q2:#ff3d71;--q3:#2dff9a;--q4:#2bb8ff;--hl:#ffd54a}
:root[data-theme="dark"] body{background:radial-gradient(900px 500px at 15% -10%,#2a0f4d66,transparent 60%),radial-gradient(800px 500px at 100% 0%,#0b3a5c66,transparent 60%),var(--bg);background-attachment:fixed}
:root[data-theme="dark"] .dcard{border-color:#7a4dff;box-shadow:0 0 12px #7a4dff55,inset 0 0 14px #7a4dff1f}
:root[data-theme="dark"] .dcard.today{border-color:var(--acc);box-shadow:0 0 18px #ff2e9a66,inset 0 0 18px #ff2e9a1f}
:root[data-theme="dark"] .logo{border-color:#7a4dff;box-shadow:0 0 12px #7a4dff99}
:root[data-theme="dark"] .brand-name{text-shadow:0 0 14px #2bb8ff99}
:root[data-theme="dark"] button{border-color:#3b2f7a}
:root[data-theme="dark"] .tbtn{border-color:#ffd54a;color:#ffd54a;box-shadow:0 0 10px #ffd54a66}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#ff2e9a33;color:var(--acc)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:14px 12px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;display:block;background:#fff;border:2px solid var(--ln)}
.brand-name{font-size:24px;font-weight:700;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px}
button{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--fg);cursor:pointer}
.seg{display:flex;border:1px solid var(--ln);border-radius:21px;overflow:hidden;height:42px}
:root[data-theme="dark"] .seg{border-color:#3b2f7a}
.seg button{border:0;border-radius:0;background:transparent;padding:0 14px;font-size:12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.tbtn{width:42px;height:42px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.tbtn svg{width:22px;height:22px}
h1{font-size:18px;margin:0 0 2px;font-weight:700}
.sub{font-size:12px;color:var(--mut)}
.clk{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 14px;font-size:13px;font-variant-numeric:tabular-nums}
.clk b{color:var(--mut);font-weight:600;margin-right:4px}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.nav{display:flex;gap:8px;margin:0 0 12px}.nav button{flex:1;font-weight:600}
.dcard{scroll-margin-top:8px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}
.dcard.today{border-color:var(--acc)}
.dt{font-size:14px;font-weight:700;letter-spacing:.8px}
.dcard.today .dt{color:var(--acc)}
.ds{font-size:12px;color:var(--mut);margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dx{font-size:11px;color:var(--mut);margin-top:2px}
.dl{position:relative;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln);max-height:min(520px,52vh);overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.it{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;transition:opacity .2s}
.ih{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.bd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:15px;padding:2px 8px;border-radius:7px;border:1.5px solid var(--ln);letter-spacing:.5px}
.bd.q1{border-color:var(--q1);background:color-mix(in srgb,var(--q1) 18%,transparent)}
.bd.q2{border-color:var(--q2);background:color-mix(in srgb,var(--q2) 18%,transparent)}
.bd.q3{border-color:var(--q3);background:color-mix(in srgb,var(--q3) 18%,transparent)}
.bd.q4{border-color:var(--q4);background:color-mix(in srgb,var(--q4) 18%,transparent)}
.st{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--mut);text-align:right}
.ic{font-size:12px;color:var(--mut);margin:6px 0 6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.itm{display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid var(--ln);padding-top:6px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.itm .ar{color:var(--mut)}
.iw{font-size:10.5px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.it.past{opacity:.42}
.it.now{border-color:var(--q3);box-shadow:0 0 12px color-mix(in srgb,var(--q3) 45%,transparent)}
.it.now .st{color:var(--q3)}
.it.next{border-color:var(--q4)}
.it.next .st{color:var(--q4)}
:root:not([data-theme="dark"]) .it.now .st{color:#2e8b57}
:root:not([data-theme="dark"]) .it.next .st{color:#2f6fb0}
.hint{font-size:11px;color:var(--mut);margin-top:14px;line-height:1.5}
@media(min-width:1000px){.nav{display:none}}
@media(max-width:430px){.top{gap:6px}.brand{gap:8px}.logo{width:34px;height:34px}.brand-name{font-size:15px}.tools{gap:6px}.seg button{padding:0 11px}}

.dh{display:block;width:100%;text-align:left;border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer}
.dh .dt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dh .ds{display:block}
.chev{font-size:13px;color:var(--mut);transition:transform .2s;transform:rotate(180deg)}
.dcard.shut .chev{transform:none}
.dcard.shut .db{display:none}
.ctog{width:100%;margin-top:12px;padding:12px;font-size:14px;font-weight:700;letter-spacing:.8px}
.ctog[aria-expanded="true"]{border-color:var(--acc);color:var(--acc)}
.cas{margin-top:8px;scroll-margin-top:8px}
.cas[hidden]{display:none}
.ih .l{display:flex;align-items:center;gap:6px;min-width:0}
.lv{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:10px;border:1px solid var(--ln);color:var(--mut)}
.cas .ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cas .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;border:1px solid var(--ln);color:var(--mut);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.cas .sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:10px}
.cas label{display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--mut);text-transform:uppercase}
.cas select{font:inherit;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;padding:9px 10px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--fg);width:100%}
.cnav{display:flex;gap:8px;margin-top:10px}
.cnav button{font-weight:600}
.cnav #cper{flex:1;font-size:12px;font-variant-numeric:tabular-nums}
.cr{font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;margin-top:3px}
.cr b{display:inline-block;width:46px;color:var(--mut);font-weight:600;font-size:10.5px}
.cas .empty{font-size:12px;color:var(--mut);text-align:center;padding:14px 0}

html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
#hdr{flex:none;width:100%;max-width:1100px;margin:0 auto;padding:8px 12px 0}
#hdr .top{margin-bottom:6px}
#hdr .clk{margin:4px 0 8px}
#hdr .nav{margin:0 0 8px}
#sc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
main{padding-top:4px}
</style></head>

<div class="dx">Sequence high prob 3 level pada rentang level target.</div>
<div class="sel"><label>Pattern<select id="cpat"></select></label><label>Target Level<select id="clvl"></select></label></div>
<div class="cnav"><button id="cprev" aria-label="Periode sebelumnya">◀</button><button id="cper"></button><button id="cnext" aria-label="Periode berikutnya">▶</button></div>
<div class="dl" id="clist"></div>
</section>
<div class="hint" id="hint"></div>
</main></div>
<script>
const H=36e5,D=24*H;
const NY=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'});
function wall(ms){const p={};NY.formatToParts(ms).forEach(x=>p[x.type]=+x.value);return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)+(((ms%1000)+1000)%1000)}
const lens=[0,0,0,0,6*H,5400000,1350000];
function info(l,w){
  const d=new Date(w),y=d.getUTCFullYear(),m=d.getUTCMonth();let s,e;
  if(l==0){s=Date.UTC(y,0,1);e=Date.UTC(y+1,0,1)}
  else if(l==1){s=Date.UTC(y,m,1);e=Date.UTC(y,m+1,1)}
  else{
    const day=Math.floor((w-18*H)/D),ds=day*D+18*H;
    if(l==2){
      const dow=((day+4)%7+7)%7;s=(day-dow)*D+18*H;
      const k=Math.floor((w-s)/D);
      if(k>=4)return{q:-1,qs:s+4*D,qe:s+7*D};
      return{q:k,qs:s+k*D,qe:s+(k+1)*D};
    }
    else if(l==3){s=ds;e=ds+D}
    else{const L=lens[l];s=ds+Math.floor((w-ds)/L)*L;e=s+L}
  }
  const q=Math.min(3,Math.max(0,Math.floor((w-s)/(e-s)*4))),qs=s+q*(e-s)/4,qe=s+(q+1)*(e-s)/4;
  return{q,qs,qe};
}
const HP=new Set('1-1-1,1-1-4,1-4-4,1-4-1,2-2-2,3-3-3,4-4-4,4-4-1,4-1-1,4-1-4'.split(','));
const HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],NM=['Yearly','Monthly','Weekly','Daily','90m','Micro','Nano'];
const p2=n=>String(n).padStart(2,'0');
const dm=w=>{const d=new Date(w);return d.getUTCDate()+' '+BL[d.getUTCMonth()]};
const tm=w=>{const d=new Date(w),f=((w%1000)+1000)%1000;return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+':'+p2(d.getUTCSeconds())+(f===500?'.5':'')};
const off=w=>wall(w+4*H)===w?4*H:5*H;
const lvl=5;
function codeOf(l,i){const t=(i.qs+i.qe)/2;return[info(l-2,t).q+1,info(l-1,t).q+1,i.q+1].join('-')}
function dayData(k){
  const ds=k*D+18*H,de=ds+D,items=[];let t=ds,g=0;
  while(t<de&&g++<500){const i=info(lvl,t),c=codeOf(lvl,i);if(HP.has(c))items.push({s:i.qs,e:i.qe,c});t=Math.max(i.qe,t)+0.01}
  const wq=info(2,ds+1).q,dow=new Date(de).getUTCDay(),mid=ds+D/2;
  return{ds,de,items,sub:`Weekly ${wq<0?'Netral':'Q'+(wq+1)} (${HR[dow]}) (${dm(de)})`,ctx:`Yearly Q${info(0,mid).q+1} · Monthly Q${info(1,mid).q+1} · ${items.length} sequence`};
}
const shut=[true,false,true];const cardsEl=document.getElementById('cards');let todayItems=[],todayList=null,lastTarget=null,curK=null;
function setCard(i,open){shut[i]=!open;const sec=cardsEl.children[i];sec.classList.toggle('shut',!open);sec.querySelector('.dh').setAttribute('aria-expanded',open);if(open&&i===1){lastTarget=null;tick(true)}}
function build(){
  const k0=Math.floor((wall(Date.now())-18*H)/D);curK=k0;cardsEl.innerHTML='';todayItems=[];lastTarget=null;
  [[k0-1,'Kemarin'],[k0,'Hari ini'],[k0+1,'Besok']].forEach(([k,nm],idx)=>{
    const d=dayData(k),sec=document.createElement('section');sec.className='dcard'+(idx===1?' today':'')+(shut[idx]?' shut':'');
    const chain=['Daily','90m','Micro'];
    const rows=d.items.map(it=>{
      const p=it.c.split('-'),o=off(it.s),S=it.s+o+7*H,E=it.e+o+7*H;
      return `<div class="it" data-s="${it.s}" data-e="${it.e}"><div class="ih"><span class="bd q${p[2]}">${it.c}</span><span class="st"></span></div>
<div class="ic">${chain.map((n,j)=>n+' Q'+p[j]).join(' › ')}</div>
<div class="itm"><span>${dm(it.s)}, ${tm(it.s)}</span><span class="ar">→</span><span>${dm(it.e)}, ${tm(it.e)}</span></div>
<div class="iw">WIB ${dm(S)}, ${tm(S)} → ${dm(E)!==dm(S)?dm(E)+', ':''}${tm(E)}</div></div>`}).join('');
    sec.innerHTML=`<button class="dh" aria-expanded="${!shut[idx]}"><span class="dt"><span>${idx===1?'⚡ ':''}${nm}</span><span class="chev">▾</span></span><span class="ds">${d.sub}</span></button><div class="db"><div class="dx">${d.ctx}</div><div class="dl">${rows}</div></div>`;
    cardsEl.append(sec);sec.querySelector('.dh').onclick=()=>setCard(idx,shut[idx]);
    if(idx===1){todayList=sec.querySelector('.dl');todayItems=[...sec.querySelectorAll('.it')]}
  });
  document.getElementById('hint').textContent=`Hari = 18:00 → 18:00 jam New York, dinamai dari tanggal akhirnya. Kode 3 angka Micro = Daily › 90m › Micro. Pola high prob: 1-1-1, 1-1-4, 1-4-4, 1-4-1, 2-2-2, 3-3-3, 4-4-4, 4-4-1, 4-1-1, 4-1-4. Jam WIB dihitung otomatis dari jam NY.`;
  tick(true);
}
const dur=ms=>{const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?`${h}j ${p2(m)}m`:`${p2(m)}:${p2(r)}`};
function tick(first){
  const real=Date.now(),now=wall(real);
  if(Math.floor((now-18*H)/D)!==curK){build();return}
  const wd=new Date(real+7*H),nd=new Date(now);
  document.getElementById('cny').textContent=`${HR[nd.getUTCDay()]} ${dm(now)} · ${tm(now).slice(0,8)}`;
  document.getElementById('cwb').textContent=`${HR[wd.getUTCDay()]} ${wd.getUTCDate()} ${BL[wd.getUTCMonth()]} · ${p2(wd.getUTCHours())}:${p2(wd.getUTCMinutes())}:${p2(wd.getUTCSeconds())}`;
  let target=null,nextSet=false;
  todayItems.forEach(el=>{
    const s=+el.dataset.s,e=+el.dataset.e,st=el.querySelector('.st');let cls='it',txt='';
    if(e<=now)cls+=' past';
    else if(s<=now){cls+=' now';txt='● SEKARANG · sisa '+dur(e-now);target=target||el}
    else if(!nextSet){nextSet=true;cls+=' next';txt='BERIKUTNYA · dalam '+dur(s-now);target=target||el}
    if(el.className!==cls)el.className=cls;if(st.textContent!==txt)st.textContent=txt;
  });
  if(!target)target=todayItems[todayItems.length-1];
  if(target&&(first||target!==lastTarget)){lastTarget=target;todayList.scrollTo({top:Math.max(0,target.offsetTop-todayList.offsetTop-4),behavior:first?'auto':'smooth'})}
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(shut[i])setCard(i,true);cardsEl.children[i].scrollIntoView({behavior:'smooth',block:'start'})});
const root=document.documentElement,tb=document.getElementById('theme');
const sunI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
const moonI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t){root.setAttribute('data-theme',t);tb.innerHTML=t==='dark'?sunI:moonI;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#07060f':'#f4f5f8'}
tb.onclick=()=>{const t=root.getAttribute('data-theme')==='dark'?'light':'dark';applyTheme(t);try{localStorage.setItem('qs_theme',t)}catch(e){}};
applyTheme(root.getAttribute('data-theme'));

/* ===== CASCADE ===== */
function period(l,w){
  const d=new Date(w),y=d.getUTCFullYear(),m=d.getUTCMonth();
  if(l==0)return[Date.UTC(y,0,1),Date.UTC(y+1,0,1)];
  if(l==1)return[Date.UTC(y,m,1),Date.UTC(y,m+1,1)];
  const day=Math.floor((w-18*H)/D),ds=day*D+18*H;
  if(l==2){const dow=((day+4)%7+7)%7,s=(day-dow)*D+18*H;return[s,s+7*D]}
  if(l==3)return[ds,ds+D];
  const L=lens[l],s=ds+Math.floor((w-ds)/L)*L;return[s,s+L];
}
function casItems(t,ps,pe){
  const out=[];let x=ps,g=0;
  while(x<pe&&g++<3000){
    const i=info(t,x),mid=(i.qs+i.qe)/2;
    if(mid>=ps&&mid<pe){const c=codeOf(t,i);if(HP.has(c))out.push({s:i.qs,e:i.qe,c})}
    x=Math.max(i.qe,x)+0.01;
  }
  return out;
}
const fm=w=>HR[new Date(w).getUTCDay()]+' '+dm(w)+' '+new Date(w).getUTCFullYear()+', '+tm(w);
const hm=w=>tm(w).slice(0,5);
function plabel(l,ps,pe){
  const y=new Date(ps).getUTCFullYear();
  if(l==0)return String(y);
  if(l==1)return BL[new Date(ps).getUTCMonth()]+' '+y;
  return dm(ps)+', '+hm(ps)+' → '+dm(pe)+', '+hm(pe);
}
const CH=[,,'Daily','90m','Micro','Nano','Pico'];
function casGather(t,anchor){
  if(t==='all'){
    const[ps,pe]=period(3,anchor),out=[];
    for(let l=2;l<=6;l++)casItems(l,ps,pe).forEach(i=>out.push({...i,t:l}));
    out.sort((x,y)=>x.s-y.s||x.t-y.t);
    return{ps,pe,pl:3,items:out};
  }
  const[ps,pe]=period(t-2,anchor);
  return{ps,pe,pl:t-2,items:casItems(t,ps,pe).map(i=>({...i,t}))};
}
let cT='all',cP='all',cA=null,casEls=[];
const clist=document.getElementById('clist');
const cpat=document.getElementById('cpat'),clvl=document.getElementById('clvl'),cas=document.getElementById('cas'),ctog=document.getElementById('ctog');
const pl=c=>c+' ('+c.split('-').map(n=>'Q'+n).join(' › ')+')';
cpat.innerHTML='<option value="all">✨ SELECT ALL ('+HP.size+' Patterns)</option>'
 +'<optgroup label="Pure Continuity">'+['1-1-1','2-2-2','3-3-3','4-4-4'].map(c=>`<option value="${c}">${pl(c)}</option>`).join('')+'</optgroup>'
 +'<optgroup label="Transitions">'+['4-4-1','4-1-1','4-1-4','1-1-4','1-4-4','1-4-1'].map(c=>`<option value="${c}">${pl(c)}</option>`).join('')+'</optgroup>';
clvl.innerHTML='<option value="all">✨ Select All</option>'+[2,3,4,5,6].map(l=>`<option value="${l}">${NM[l]} (4 x ${CH[l]})</option>`).join('');
function casBuild(){
  const now=wall(Date.now());if(cA===null)cA=now;
  const g=casGather(cT,cA),ps=g.ps,pe=g.pe;
  let items=g.items;if(cP!=='all')items=items.filter(i=>i.c===cP);
  const cur=ps<=now&&now<pe;
  document.getElementById('ccount').textContent=items.length+' sequence';
  document.getElementById('cper').textContent=plabel(g.pl,ps,pe)+(cur?' · sekarang':' · ↺ ke sekarang');
  clist.innerHTML=items.length?items.map(it=>{
    const p=it.c.split('-'),o=off(it.s),S=it.s+o+7*H,E=it.e+o+7*H,chain=[NM[it.t-2],NM[it.t-1],NM[it.t]];
    return `<div class="it" data-s="${it.s}" data-e="${it.e}"><div class="ih"><span class="l"><span class="bd q${p[2]}">${it.c}</span><span class="lv">${NM[it.t]}</span></span><span class="st"></span></div>
<div class="ic">${chain.map((n,j)=>n+' Q'+p[j]).join(' › ')}</div>
<div class="cr"><b>START</b>${fm(it.s)}</div><div class="cr"><b>END</b>${fm(it.e)}</div>
<div class="iw">WIB ${dm(S)}, ${tm(S)} → ${dm(E)!==dm(S)?dm(E)+', ':''}${tm(E)}</div></div>`}).join(''):'<div class="empty">Tidak ada sequence high prob di periode ini.</div>';
  casEls=[...clist.querySelectorAll('.it')];casTick();
  const tg=casEls.find(el=>el.classList.contains('now'))||casEls.find(el=>!el.classList.contains('past'));
  clist.scrollTop=tg?Math.max(0,tg.offsetTop-clist.offsetTop-4):0;
}
function casTick(){
  const now=wall(Date.now());
  casEls.forEach(el=>{
    const s=+el.dataset.s,e=+el.dataset.e,st=el.querySelector('.st');let cls='it',txt='';
    if(e<=now)cls+=' past';else if(s<=now){cls+=' now';txt='● SEKARANG · sisa '+dur(e-now)}
    if(el.className!==cls)el.className=cls;if(st.textContent!==txt)st.textContent=txt;
  });
}
const casPl=()=>cT==='all'?3:cT-2;
cpat.onchange=()=>{cP=cpat.value;casBuild()};
clvl.onchange=()=>{cT=clvl.value==='all'?'all':+clvl.value;cA=null;casBuild()};
document.getElementById('cprev').onclick=()=>{cA=period(casPl(),cA)[0]-1;casBuild()};
document.getElementById('cnext').onclick=()=>{cA=period(casPl(),cA)[1];casBuild()};
document.getElementById('cper').onclick=()=>{cA=null;casBuild()};
ctog.onclick=()=>{
  const open=cas.hidden;cas.hidden=!open;
  ctog.setAttribute('aria-expanded',open);ctog.textContent=open?'PREDIKSI ▴':'PREDIKSI ▾';
  if(open){cA=null;casBuild();cas.scrollIntoView({behavior:'smooth',block:'start'})}
};
build();setInterval(()=>{tick(false);casTick()},1000);
</script></body></html>
