name: Build APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Buat proyek Capacitor
        run: |
          mkdir -p www
          cp quarter_sequence_search_engine.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Sequence High Prob" com.wansverse.highprob --web-dir www
          npx cap add android

      - name: Ikon dari logo (opsional)
        continue-on-error: true
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          import re, base64, io
          from PIL import Image, ImageDraw
          html = open("quarter_sequence_search_engine.html", encoding="utf-8").read()
          m = re.search(r"data:image/png;base64,([A-Za-z0-9+/=]+)", html)
          img = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert("RGBA")
          side = min(img.size)
          img = img.crop(((img.width - side) // 2, (img.height - side) // 2, (img.width + side) // 2, (img.height + side) // 2))

          def circle(im):
              mask = Image.new("L", im.size, 0)
              ImageDraw.Draw(mask).ellipse((0, 0, im.size[0] - 1, im.size[1] - 1), fill=255)
              out = Image.new("RGBA", im.size, (0, 0, 0, 0))
              out.paste(im, (0, 0), mask)
              return out

          for d, s in (("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)):
              base = "android/app/src/main/res/mipmap-%s/" % d
              ic = circle(img.resize((s, s), Image.LANCZOS))
              ic.save(base + "ic_launcher.png")
              ic.save(base + "ic_launcher_round.png")
              f = int(s * 108 / 48)
              fg = Image.new("RGBA", (f, f), (0, 0, 0, 0))
              inner = int(f * 0.58)
              fg.paste(circle(img.resize((inner, inner), Image.LANCZOS)), ((f - inner) // 2, (f - inner) // 2))
              fg.save(base + "ic_launcher_foreground.png")
          print("icon ok")
          PY

      - name: Build APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Sequence-HighProb.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sequence-HighProb-apk
          path: Sequence-HighProb.apk

      - name: Rilis APK (unduh langsung dari halaman Releases)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: apk-terbaru
          name: APK terbaru
          files: Sequence-HighProb.apk
